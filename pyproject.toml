[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stamp-hf-correlation-topsis"
version = "0.2.0"
description = "Risk-adaptive hesitant fuzzy interactive TOPSIS research toolkit"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "scipy>=1.10,<2",
]

[tool.setuptools.packages.find]
include = ["stamp_hf*"]
